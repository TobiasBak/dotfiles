# Untested: never booted.
# Manual TPM migration asset; the native bootstrap does not install this file.
# Omarchy's initramfs uses busybox hooks, whose encrypt hook cannot use a TPM.
# Swap them for the systemd equivalents so sd-encrypt unlocks the root from
# /etc/crypttab.initramfs, which must be prepared and validated manually first.
# Sorting after Omarchy's drop-ins keeps this working when Omarchy rewrites its
# own hook list.
_tpm2_hooks=()
for _tpm2_hook in "${HOOKS[@]}"; do
  case $_tpm2_hook in
    udev) _tpm2_hooks+=(systemd) ;;
    keymap) _tpm2_hooks+=(sd-vconsole) ;;
    encrypt) _tpm2_hooks+=(sd-encrypt) ;;
    btrfs-overlayfs) _tpm2_hooks+=(sd-btrfs-overlayfs) ;;
    # sd-vconsole covers the console font; systemd resumes from hibernation itself.
    consolefont | resume) ;;
    *) _tpm2_hooks+=("$_tpm2_hook") ;;
  esac
done
HOOKS=("${_tpm2_hooks[@]}")
unset _tpm2_hooks _tpm2_hook
