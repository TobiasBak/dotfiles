[Service]
Environment=T3CODE_HOST=127.0.0.1
Environment=T3CODE_PORT=3773
Environment=T3CODE_TAILSCALE_SERVE=true
Environment=T3CODE_TAILSCALE_SERVE_PORT=443
# Agents have no terminal for prompts; fail instead of popping a GUI askpass.
Environment=SSH_ASKPASS_REQUIRE=never
# Agent temp files go to disk; agent-tmp.conf creates and ages the directory.
Environment=TMPDIR=%h/.cache/agent-tmp
OOMPolicy=continue
Slice=app-t3code.slice
