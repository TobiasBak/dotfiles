# Agent setup: global instructions, Claude/Codex/Pi configs, skills, and the
# T3 Code background service with its drop-in, memory slice, disk-backed
# TMPDIR, nightly updater and nightly restic backup to serv01, plus the
# OpenCode free-model tracker.

[links]
"~/.local/bin/win-vm" = "agents/windows-vm/win-vm"
"~/.local/bin/opencode-free" = "agents/opencode-free/opencode-free"
"~/.claude/CLAUDE.md" = "agents/AGENTS.md"
"~/.codex/AGENTS.md" = "agents/AGENTS.md"
"~/.pi/agent/APPEND_SYSTEM.md" = "agents/AGENTS.md"
"~/.pi/agent/extensions/report-to-cos.ts" = "agents/pi/report-to-cos.ts"
"~/.codex/prompts/yeet.md" = "agents/codex/prompts/yeet.md"
# Omarchy links its own skills into both directories; those stay untouched.
"~/.agents/skills/*" = "../vault-public/skills/*"
"~/.claude/skills/*" = "../vault-public/skills/*"
# T3 writes t3code.service itself; the repo owns only the drop-in and slice.
"~/.config/systemd/user/t3code.service.d/local.conf" = "agents/systemd/t3code.service.d/local.conf"
"~/.config/systemd/user/app-t3code.slice" = "agents/systemd/app-t3code.slice"
"~/.config/systemd/user/t3code-update.service" = "agents/systemd/t3code-update.service"
"~/.config/systemd/user/t3-backup.service" = "agents/systemd/t3-backup.service"
"~/.config/systemd/user/t3-backup.timer" = "agents/systemd/t3-backup.timer"
"~/.config/systemd/user/opencode-free.service" = "agents/systemd/opencode-free.service"
"~/.config/systemd/user/opencode-free.timer" = "agents/systemd/opencode-free.timer"
# gah owns its units; link them from its gah main checkout.
"~/.config/systemd/user/gah-gc.service" = "../../git-at-home/git-at-home/main/systemd/gah-gc.service"
"~/.config/systemd/user/gah-gc.timer" = "../../git-at-home/git-at-home/main/systemd/gah-gc.timer"
"~/.config/user-tmpfiles.d/agent-tmp.conf" = "agents/systemd/agent-tmp.conf"

# The apps rewrite these files; the repo owns only the keys it lists.
[merge]
"~/.claude/settings.json" = "agents/claude/settings.json"
"~/.codex/config.toml" = "agents/codex/config.toml"
"~/.pi/agent/settings.json" = "agents/pi/settings.json"
"~/.t3/userdata/settings.json" = "agents/t3/settings.json"

[systemd]
enable = ["t3-backup.timer", "opencode-free.timer", "gah-gc.timer", "systemd-tmpfiles-clean.timer"]

[[assert]]
name = "Artificial Analysis API key stored"
check = "test -s {home}/.keys/artificial-analysis"
fix = "store the Artificial Analysis API key at ~/.keys/artificial-analysis, mode 0600 (dotfiles#14)"

[[assert]]
name = "agent TMPDIR exists"
check = "test -d {home}/.cache/agent-tmp"
apply = "systemd-tmpfiles --user --create agent-tmp.conf"

# Projects on another filesystem otherwise get a store at that filesystem's
# root, so projects under /tmp kept one in RAM. pnpm 11 writes global config
# only when its global bin directory is on PATH.
[[assert]]
name = "pnpm store on disk"
check = "mise exec pnpm -- pnpm config get store-dir"
expect = "{home}/.local/share/pnpm/store"
apply = "PATH={home}/.local/share/pnpm/bin:$PATH mise exec pnpm -- pnpm config set --global store-dir {home}/.local/share/pnpm/store"

# The skill ships inside the installed playwright-cli version, which prints its
# path, relative to the cwd, only to coding agents.
[[assert]]
name = "playwright-cli skill linked to the installed version"
check = "p=$(cd / && CLAUDECODE=1 mise exec npm:@playwright/cli -- playwright-cli --help | sed -n 's/^ *Agent skill: //p') && s=$(cd / && dirname \"$(realpath -e \"$p\")\") && test \"$(readlink -f {home}/.agents/skills/playwright-cli)\" = \"$s\""
apply = "p=$(cd / && CLAUDECODE=1 mise exec npm:@playwright/cli -- playwright-cli --help | sed -n 's/^ *Agent skill: //p') && s=$(cd / && dirname \"$(realpath -e \"$p\")\") && ln -sfnT \"$s\" {home}/.agents/skills/playwright-cli"

# tb can't read /etc/polkit-1/rules.d, and probing the rule through pkexec
# would open a password dialog when it is missing. tb's docker group is
# root-equivalent anyway, so a throwaway container with Omarchy's Windows VM
# image (present once the VM is installed) reads and installs the rule.
[[assert]]
name = "Windows VM polkit rule installed"
check = '''docker run --rm --pull never --network none --entrypoint sh -v "{repo}/agents/windows-vm/50-omarchy-windows-vm.rules:/repo.rules:ro" -v /etc/polkit-1/rules.d:/rules:ro dockurr/windows -c 'cmp /repo.rules /rules/50-omarchy-windows-vm.rules && test "$(stat -c %u:%g:%a /rules/50-omarchy-windows-vm.rules)" = 0:0:644' '''
# polkitd loads only *.rules, so the temporary copy is ignored until the rename.
apply = '''docker run --rm --pull never --network none --entrypoint sh -v "{repo}/agents/windows-vm/50-omarchy-windows-vm.rules:/repo.rules:ro" -v /etc/polkit-1/rules.d:/rules dockurr/windows -c 'install -m 0644 -o root -g root /repo.rules /rules/.50-omarchy-windows-vm.tmp && mv -f /rules/.50-omarchy-windows-vm.tmp /rules/50-omarchy-windows-vm.rules || { rm -f /rules/.50-omarchy-windows-vm.tmp; exit 1; }' '''

[[assert]]
name = "T3 background service installed"
check = "test -f {home}/.config/systemd/user/t3code.service"
apply = "bash {repo}/agents/t3/nightly.sh --install-service"

[[assert]]
name = "retired Pi workspace-view snapshot extension disabled"
check = 'python3 "{repo}/agents/pi/disable-workspace-view.py" --check "{siblings}/pi-workspace-view/src/snapshot.ts"'
apply = 'python3 "{repo}/agents/pi/disable-workspace-view.py" "{siblings}/pi-workspace-view/src/snapshot.ts"'

[[assert]]
name = "unused Claude Sonnet compaction override removed"
check = "python3 {repo}/agents/claude/drop-sonnet.py --check"
apply = "python3 {repo}/agents/claude/drop-sonnet.py"

# A unit change reaches T3 and its agents only after a restart, which
# interrupts every hosted agent turn.
[[assert]]
name = "running T3 server has the drop-in environment and slice"
check = "pid=$(systemctl --user show -p MainPID --value t3code.service) && test \"$pid\" -gt 0 && tr '\\0' '\\n' < /proc/$pid/environ | grep -qx 'TMPDIR={home}/.cache/agent-tmp' && tr '\\0' '\\n' < /proc/$pid/environ | grep -qx 'SSH_ASKPASS_REQUIRE=never' && grep -q '/app-t3code.slice/' /proc/$pid/cgroup"
fix = "systemctl --user restart t3code.service  # interrupts hosted agents"

[[assert]]
name = "T3 published on the tailnet"
check = "tailscale serve status 2>/dev/null | grep -q 'proxy http://127.0.0.1:3773'"
apply = "tailscale serve --bg --yes http://127.0.0.1:3773"

[[assert]]
name = "user lingering keeps T3 running without a login"
check = "loginctl show-user \"$USER\" -p Linger --value"
expect = "yes"
fix = "sudo loginctl enable-linger \"$USER\""

[[assert]]
name = "tailscaled enabled with the desktop user as operator"
check = "systemctl is-enabled --quiet tailscaled && tailscale status >/dev/null 2>&1"
fix = "sudo systemctl enable --now tailscaled && sudo tailscale set --operator=\"$USER\" && sudo tailscale up"

# Secrets are restored by hand (omarchy/README.md: Manual restore).
# desktop/module.toml owns the NAS automount and Samba credential checks.
[[assert]]
name = "SSH key for tobias-serv01 restored"
check = "test -f {home}/.ssh/id_ed25519"
fix = "create an SSH key and ssh-copy-id it to tobias-serv01 (README: Manual restore)"

[[assert]]
name = "T3 restic password restored"
check = "test -f {home}/.config/restic/t3-password"
fix = "copy .config/restic/t3-password from the cold NixOS disk (README: Manual restore)"
