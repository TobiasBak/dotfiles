[Service]
Environment=T3CODE_HOST=0.0.0.0
Environment=T3CODE_PORT=3773
Environment=T3CODE_TAILSCALE_SERVE=true
Environment=T3CODE_TAILSCALE_SERVE_PORT=443
Environment=CLAUDE_CODE_DISABLE_1M_CONTEXT=1
OOMPolicy=continue
# PC budget: 30 GiB RAM minus the 8 GiB Windows VM and 6 GiB for the desktop.
# Reclaim above 12 GiB; contain runaway agent tools at 16 GiB and 1 GiB swap.
MemoryHigh=12G
MemoryMax=16G
MemorySwapMax=1G
