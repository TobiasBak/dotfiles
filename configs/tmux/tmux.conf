set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
set -g extended-keys-format csi-u
set -g set-clipboard on
set -as terminal-features ",xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm*:extkeys"
set -g default-command "ZSH_TMUX_FAST=1 zsh -l"

set -g mouse on
setw -g mode-keys vi
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind -q C-a
set -g prefix C-b
bind C-b send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

set -g status on
set -g status-position top
set -gu status-format
set -g status-interval 5
set -g status-style "bg=#2a273f,fg=#e0def4"
set -g status-left ""
set -g status-right "#[fg=#9ccfd8] %Y-%m-%d #[fg=#c4a7e7]%H:%M "
set -g window-status-format "#[fg=#e0def4] #I: #W "
set -g window-status-current-format "#[bg=#f6c177,fg=#191724,bold] #I: #W "
set -g window-status-current-style "bg=#f6c177,fg=#191724,bold"
set -g window-status-style "bg=#2a273f,fg=#e0def4"
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#c4a7e7"
