[links]
"~/.config/hunk/config.toml" = "cli/hunk/config.toml"
"~/.gitconfig" = "cli/git/config"
"~/.local/bin/pr-merge" = "cli/pr-merge.py"
"~/.local/bin/heavy-lease" = "cli/heavy-lease.py"

[[assert]]
name = "Git config contains only current Omarchy defaults"
check = "cmp -s /usr/share/omarchy/config/git/config {home}/.config/git/config"
apply = "python3 {repo}/cli/migrate-git.py"
