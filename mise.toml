[tools]
"aqua:modem-dev/hunk" = "latest"
"cargo:cargo-mutants" = "27.1.0"
claude = "latest"
codex = "latest"
gcloud = "latest"
gh = "latest"
gitleaks = "8.30.1"
go = "latest"
# Omarchy Node version, shared by mise-managed npm tools.
node = "26.8.2"
# OpenCode 2. pnpm skips its postinstall, which links the native binary, unless allowed.
"npm:@opencode/cli" = { version = "latest", allow_builds = "@opencode/cli" }
"npm:@playwright/cli" = "latest"
"npm:vite-plus" = "latest"
pi = "latest"
pnpm = "11"
terraform = "latest"
uv = "latest"

[settings.npm]
package_manager = "pnpm"

[settings.upgrade]
auto_prune = false

[env]
PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/usr/bin/chromium"
