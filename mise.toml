[tools]
"aqua:modem-dev/hunk" = "latest"
"cargo:cargo-mutants" = "27.1.0"
claude = "latest"
codex = "latest"
gcloud = "latest"
gh = "latest"
"github:TobiasBak/verify-at-home" = { version = "path:~/.local/share/verify-at-home/installs/b45c37320513e0394d777c7633c8697d04c5b7c9", lazy = true, lazy_bins = ["vah"] }
"github:mstange/samply" = "latest"
gitleaks = "8.30.1"
go = "latest"
"http:muse" = { version = "latest", url = "https://api.meta.ai/muse-launcher.sh", bin = "muse", version_list_url = "https://api.meta.ai/muse-code/channels/muse-stable", version_json_path = ".version" }
# Omarchy Node version, shared by mise-managed npm tools.
node = "26.8.2"
# OpenCode 2. pnpm skips its postinstall, which links the native binary, unless allowed.
"npm:@opencode/cli" = { version = "latest", allow_builds = "@opencode/cli" }
"npm:@playwright/cli" = "latest"
"npm:playwright" = "latest"
"npm:vite-plus" = "latest"
pi = "latest"
pnpm = "11"
rclone = "latest"
terraform = "latest"
uv = "latest"

[settings.npm]
package_manager = "pnpm"

[settings.upgrade]
auto_prune = false

[env]
PLAYWRIGHT_MCP_EXECUTABLE_PATH = "/usr/bin/chromium"
